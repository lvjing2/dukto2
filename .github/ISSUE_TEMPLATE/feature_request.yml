name: Feature request / 需求建议
description: Describe a use case in English or Chinese. / 请用中文或英文描述使用场景和现有方案的不足。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 遇到了什么问题
      description: Include devices, systems, context and what the current flow cannot do. / 说明设备、系统、具体场景及当前流程的不足。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed improvement / 希望如何改善
      description: Include alternatives and acceptable tradeoffs. / 可补充替代方案和能接受的取舍。
