name: Bug report / 问题反馈
description: Report a reproducible problem in English or Chinese. / 请用中文或英文反馈，提交前移除个人信息。
title: "[Bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment / 系统与版本
      description: Sender and receiver OS, architecture, app version and installation source. / 包含两端系统、架构、应用版本和安装来源。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / 复现步骤
      description: Include discovery or manual connection, network setup, and background or screen-off state. / 说明连接方式、网络环境及后台或锁屏状态。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior / 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted logs or screenshots / 脱敏日志或截图
      description: No passwords, private keys, real file contents or personal information. Follow SECURITY.md for vulnerabilities. / 请勿包含密码、私钥、真实文件内容或个人信息，漏洞请遵循安全说明。
