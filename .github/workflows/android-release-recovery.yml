name: Android tagged-release recovery

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing immutable release tag to rebuild
        required: true
        default: v0.1.8
        type: string

permissions:
  contents: read

concurrency:
  group: android-recovery-${{ inputs.source_tag }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Validate release tag input
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', os.environ['SOURCE_TAG'])
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check immutable source and resolve locked dependencies
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          python3 - <<'PY'
          import os, runpy
          package = runpy.run_path('tool/ci/package_release.py')
          package['check_tag']('refs/tags/' + os.environ['SOURCE_TAG'])
          PY
          flutter pub get --enforce-lockfile
          (cd packages/dukto2_core && dart pub get --enforce-lockfile)
      - name: Bootstrap ignored Gradle wrapper from pinned Flutter
        run: flutter build apk --debug --target-platform android-arm64
      - name: Signed APK, native privacy tests and verified Play AAB
        env:
          ANDROID_APP_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_KEYSTORE_BASE64 }}
          ANDROID_APP_STORE_PASSWORD: ${{ secrets.ANDROID_APP_STORE_PASSWORD }}
          ANDROID_APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_KEY_ALIAS }}
          ANDROID_APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: python tool/ci/build_android_release.py
      - name: Package original tagged source with licenses and checksums
        env:
          RELEASE_TARGET: android
        run: python tool/ci/package_release.py android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: dist/*
          if-no-files-found: error
          retention-days: 30
