name: Publish verified native release

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Existing immutable release tag
        default: v0.1.8
        required: true
        type: string
      native_run:
        description: Native release workflow run ID
        default: '44450887132'
        required: true
        type: string
      android_run:
        description: Successful Android recovery run ID
        default: '44452624552'
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-verified-${{ inputs.source_tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate inputs
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          NATIVE_RUN: ${{ inputs.native_run }}
          ANDROID_RUN: ${{ inputs.android_run }}
        run: |
          python3 - <<'PY'
          import os, re
          assert re.fullmatch(r'v\d+\.\d+\.\d+', os.environ['SOURCE_TAG'])
          assert os.environ['NATIVE_RUN'].isdigit() and os.environ['ANDROID_RUN'].isdigit()
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_tag }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.native_run }}
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.android_run }}
          name: release-android
          path: dist
      - name: Verify original payloads and immutable source
        working-directory: dist
        run: |
          sha256sum --check *.sha256
          python3 - <<'PY'
          import json, pathlib, subprocess
          expected = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          reports = [json.loads(p.read_text()) for p in pathlib.Path('.').glob('Dukto2-*.json')]
          assert len(reports) == 7
          assert all(r['commit'] == expected for r in reports), 'Mixed source commits'
          PY
      - name: Prepare verified public downloads
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, runpy
          package = runpy.run_path('tool/ci/package_release.py')
          package['check_tag']('refs/tags/' + os.environ['SOURCE_TAG'])
          pathlib.Path('version.txt').write_text(package['version']())
          PY
          python3 tool/ci/prepare_release_assets.py dist release-assets --version "$(cat version.txt)"
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
      - name: Create verified draft then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          notes = (Path('docs/releases') / (os.environ['RELEASE_TAG'] + '.md')).read_text()
          notes += '\n\n' + Path('docs/releases/DISTRIBUTION.md').read_text()
          assert not any('\u4e00' <= c <= '\u9fff' for c in notes), 'English release notes required'
          Path('notes.md').write_text(notes)
          PY
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("existing.json"))["isDraft"], "Refusing to alter a published release"'
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "Dukto2 ${RELEASE_TAG#v}" --notes-file notes.md
          fi
          gh release view "$RELEASE_TAG" --json assets > assets.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = {p.name: p.stat().st_size for p in Path('release-assets').iterdir()}
          actual = {a['name']: a['size'] for a in json.load(open('assets.json'))['assets']}
          assert actual == expected, 'Missing, extra or wrong-sized release attachments'
          assert any(n.endswith('-windows-x64-setup.exe') for n in actual)
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest --notes-file notes.md
