name: Release builds

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Check release version
        run: python tool/ci/package_release.py check
      - name: Analyze and test
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
          ./tool/check.sh
      - name: Check Dart formatting
        run: ./tool/dartw format --output=none --set-exit-if-changed lib test packages/dukto2_core/lib packages/dukto2_core/bin packages/dukto2_core/test

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            runner: ubuntu-24.04
          - target: windows
            runner: windows-2025
          - target: macos
            runner: macos-26
          - target: android
            runner: ubuntu-24.04
          - target: ios
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Resolve locked dependencies
        shell: bash
        run: |
          flutter pub get --enforce-lockfile
          (cd packages/dukto2_core && dart pub get --enforce-lockfile)
      - name: Linux native build
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
          ./tool/linux.sh --skip-tests --skip-doctor
      - name: Windows tests and native build
        if: matrix.target == 'windows'
        shell: pwsh
        run: ./tool/windows.ps1
      - name: macOS tests and native build
        if: matrix.target == 'macos'
        run: |
          xcodebuild -version
          ./tool/check.sh
          flutter build macos --release
      - name: Java for Android
        if: matrix.target == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android unsigned release APKs
        if: matrix.target == 'android'
        env:
          DUKTO2_ANDROID_UNSIGNED: 'true'
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
      - name: iOS unsigned device build
        if: matrix.target == 'ios'
        run: |
          xcodebuild -version
          flutter build ios --release --no-codesign
      - name: Package with licenses and SHA-256
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python tool/ci/package_release.py "$RELEASE_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify downloads
        working-directory: dist
        run: sha256sum --check *.sha256
      - name: Create or update draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          Development preview. Native CI compilation does not verify LAN transfer or device UI.

          Windows/Linux: complete portable bundles. macOS: ad-hoc signed, not notarized.
          Android: unsigned APKs; sign before installing. iOS: unsigned device app, not an installable IPA.
          Each package includes license notices; verify its SHA-256 sidecar. Signing and architecture are recorded in JSON metadata.
          EOF
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "Refusing to overwrite a published release"'
            gh release upload "$RELEASE_TAG" dist/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "Dukto2 $RELEASE_TAG" --notes-file notes.md
          fi
