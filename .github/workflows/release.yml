name: Release builds

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (tags always build all)
        type: choice
        default: all
        options: [all, android, ios, macos, windows, windows-arm64, linux, linux-arm64]
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.version.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Check release version
        id: version
        env:
          RELEASE_PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          python tool/sync_project_version.py --check
          python tool/ci/package_release.py check
      - name: Analyze and test
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
          ./tool/check.sh
      - name: Check Dart formatting
        run: ./tool/dartw format --output=none --set-exit-if-changed lib test packages/dukto2_core/lib packages/dukto2_core/bin packages/dukto2_core/test

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Resolve locked dependencies
        shell: bash
        run: |
          flutter pub get --enforce-lockfile
          (cd packages/dukto2_core && dart pub get --enforce-lockfile)
      - name: Linux native build
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
          ./tool/linux.sh --skip-tests --skip-doctor
      - name: Windows tests and native build
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: ./tool/windows.ps1
      - name: macOS tests and native build
        if: matrix.target == 'macos'
        run: |
          xcodebuild -version
          ./tool/check.sh
          flutter build macos --release
      - name: Java for Android
        if: matrix.target == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android signed APK and Play AAB
        if: matrix.target == 'android'
        env:
          ANDROID_APP_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_KEYSTORE_BASE64 }}
          ANDROID_APP_STORE_PASSWORD: ${{ secrets.ANDROID_APP_STORE_PASSWORD }}
          ANDROID_APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_KEY_ALIAS }}
          ANDROID_APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: python tool/ci/build_android_release.py
      - name: iOS unsigned device build
        if: matrix.target == 'ios'
        run: |
          xcodebuild -version
          flutter build ios --release --no-codesign
      - name: Package with licenses and SHA-256
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python tool/ci/package_release.py "$RELEASE_TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify downloads
        working-directory: dist
        run: sha256sum --check *.sha256
      - name: Prepare downloads by operating system and architecture
        run: python3 tool/ci/prepare_release_assets.py dist release-assets --version "$(jq -r .version dist/*-android.json)"
      - name: Create or update draft only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 - <<'PYNOTES'
          import os
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          source = Path('docs/releases') / (tag + '.md')
          fallback = 'See the [changelog](https://github.com/' + os.environ['GH_REPO'] + '/blob/' + tag + '/CHANGELOG.md) for changes.\n'
          notes = source.read_text() if source.is_file() else fallback
          notes += '\n\n' + Path('docs/releases/DISTRIBUTION.md').read_text()
          if any('\u4e00' <= char <= '\u9fff' for char in notes):
              raise SystemExit('Release notes must be written in English.')
          Path('notes.md').write_text(notes)
          PYNOTES
          RELEASE_TITLE="Dukto2 ${RELEASE_TAG#v}"
          if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "Refusing to overwrite a published release"'
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes-file notes.md
          else
            release_flags=(--draft)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag "${release_flags[@]}" --title "$RELEASE_TITLE" --notes-file notes.md
          fi
