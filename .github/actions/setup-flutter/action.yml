name: Checksum-pinned Flutter
description: Install the official SDK for this runner using the repository's hash lock.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.12'
    - shell: bash
      run: python tool/ci/install_flutter.py
    - shell: bash
      run: flutter --version
