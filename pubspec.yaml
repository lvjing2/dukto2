name: dukto2
description: Encrypted LAN file and text sharing for macOS, Windows, Linux, Android, and iOS.
publish_to: none
version: 0.1.6-rc.6+13
environment:
  sdk: ^3.13.5
dependencies:
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  dukto2_core:
    path: packages/dukto2_core
  path: ^1.9.1
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  camera_platform_interface: ^2.15.0
  camera_windows: ^0.3.0
  image: ^4.12.0
  zxing2: ^0.2.4
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/project-version.json
    - assets/branding/dukto2.png
