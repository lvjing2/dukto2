<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dukto2 · 最近传输布局预览</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color-scheme:light;--bg:#f1f3f6;--surface:#fff;--ink:#192230;--muted:#596575;--line:#dce1e8;--primary:#2563eb;--success:#16714c;--subtle:#f7f8fa}
:root[data-theme=dark]{color-scheme:dark;--bg:#14171d;--surface:#22262e;--ink:#f0f2f6;--muted:#afb9c8;--line:#424b59;--primary:#93b4ff;--success:#8bdbb4;--subtle:#1b1f26}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}button,select{font:inherit;color:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--primary);outline-offset:3px}button{touch-action:manipulation}button:hover{background:var(--subtle)}button:active{opacity:.75}h1,h2,p{margin:0}main{max-width:1140px;margin:0 auto;padding:32px 28px 48px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}h1{font-size:22px;font-weight:600}.draft{color:var(--muted);font-size:12px;margin-top:4px}.theme{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:8px 14px}.label{font-size:13px;color:var(--muted);margin:20px 0 10px}.surface{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px 28px}.list-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:12px}h2{font-size:14px;font-weight:600}select{font-size:14px;min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 12px;width:220px;max-width:55%}.record{display:flex;align-items:center;gap:16px;padding:12px 0}.direction{width:22px;height:22px;color:var(--muted);flex-shrink:0;margin-right:0}.direction svg{display:block;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.content{flex:1;min-width:0}.title-line{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.name{font-size:14px;font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.bytes{font-size:12px;color:var(--muted);white-space:nowrap;line-height:21px}.peer{color:var(--muted);font-size:12px;margin-top:6px;overflow-wrap:anywhere}.state{color:var(--success)}.timing{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0;min-width:120px;text-align:right;margin-left:8px}.elapsed{margin-top:6px}.action{border:0;background:transparent;color:var(--primary);padding:8px 12px;min-height:48px;min-width:80px;border-radius:8px;font-size:14px;white-space:nowrap;flex-shrink:0}.lower{display:contents}.phone-wrap{width:375px;max-width:100%}.phone{padding:20px;border-radius:20px}.phone .direction{display:none}.phone .record{display:block;padding:12px 0}.phone .lower{display:flex;align-items:center;gap:8px;margin-top:6px}.phone .content{display:contents}.phone .peer{margin-top:0}.phone .details{flex:1;min-width:0}.phone .timing{margin:4px 0 0;text-align:left;min-width:0;display:flex;flex-wrap:wrap;gap:4px 8px}.phone .elapsed{margin:0}.phone .action{padding:8px 12px}.phone .list-head{margin-bottom:12px}.phone select{width:180px}.notes{color:var(--muted);font-size:13px;margin-top:20px;max-width:680px}.preview-bottom{display:flex;align-items:flex-start;gap:32px}.explanation{padding-top:48px;max-width:420px}.explanation p{margin:0 0 18px}.explanation strong{color:var(--ink);font-weight:550;display:block;margin-bottom:4px}dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);max-width:440px;width:calc(100% - 40px);padding:24px}dialog::backdrop{background:#0006}dialog pre{font:inherit;white-space:pre-wrap;line-height:1.7;margin:20px 0}dialog footer{display:flex;justify-content:flex-end;gap:8px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 20px;border-radius:10px;max-width:90%;font-size:13px}#toast:empty{display:none}
@media(max-width:700px){main{padding:20px 16px 36px}.surface.desktop{padding:16px;overflow-x:auto}.desktop .records,.desktop .list-head{min-width:780px}.preview-bottom{display:block}.explanation{padding-top:20px}.page-head{align-items:flex-start}h1{font-size:20px}}
</style>
</head>
<body>
<main>
  <div class="page-head"><div><h1>最近传输 · 布局预览</h1><p class="draft">演示数据 · 待确认 · 尚未更新到设备</p></div><button class="theme" id="theme">切换深色</button></div>
  <p class="label">桌面 / 平板宽屏</p>
  <section class="surface desktop" aria-label="桌面布局预览">
    <div class="list-head"><h2>最近传输</h2><select aria-label="桌面按设备筛选"></select></div><div class="records"></div>
  </section>
  <div class="preview-bottom">
    <div class="phone-wrap"><p class="label">手机 · 375px</p><section class="surface phone" aria-label="手机布局预览"><div class="list-head"><h2>最近传输</h2><select aria-label="手机按设备筛选"></select></div><div class="records"></div></section></div>
    <div class="explanation notes">
      <p><strong>先看内容，再看设备</strong>名称加粗，大小紧随其后；把「来自 / 发往」和单独的状态合并为「已接收 · 设备 / 已发送 · 设备」。</p>
      <p><strong>时间与耗时降低强调</strong>宽屏独立放在右侧；手机放在设备下面，空间不足时自然换行。</p>
      <p><strong>每条记录只保留一个操作</strong>文本「查看文本」，文件「打开目录」。按钮始终靠右，复制放在文本查看页。</p>
    </div>
  </div>
</main>
<dialog id="text-view"><h2>文本消息</h2><pre>明天下午 3 点讨论 Dukto2 的界面设计。

这是布局预览的演示文本。</pre><footer><button class="action" id="copy">复制</button><button class="action" id="close">关闭</button></footer></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const data=[
 {name:'旅行照片.zip',bytes:'128.0 MB',peer:'iPad',incoming:true,time:'今天 14:28',elapsed:'耗时 8.2 秒',text:false},
 {name:'文本消息',bytes:'16.0 MB',peer:'REDMI K90',incoming:false,time:'今天 14:24',elapsed:'耗时 2.3 秒',text:true},
 {name:'Dukto2-项目资料与设计文档.zip',bytes:'1.20 GB',peer:'MacBook Pro',incoming:false,time:'昨天 20:36',elapsed:'耗时 1 分 12 秒',text:false}
];
const arrow=incoming=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 16v4h14v-4M12 3v12m-5-${incoming?'5 5 5 5-5':'2 5-5 5 5'}"/></svg>`;
function render(surface,device=''){
 surface.querySelector('.records').innerHTML=data.filter(row=>!device||row.peer===device).map(row=>{
  const title=`<div class="title-line"><div class="name" title="${row.name}">${row.name}</div><span class="bytes">${row.bytes}</span></div>`;
  const peer=`<div class="peer"><span class="state">${row.incoming?'已接收':'已发送'}</span> · ${row.peer}</div>`;
  const timing=`<div class="timing"><span>${row.time}</span><div class="elapsed">${row.elapsed}</div></div>`;
  const action=`<button class="action" data-action="${row.text?'text':'directory'}">${row.text?'查看文本':'打开目录'}</button>`;
  if(surface.classList.contains('phone')) return `<article class="record">${title}<div class="lower"><div class="details">${peer}${timing}</div>${action}</div></article>`;
  return `<article class="record"><div class="direction">${arrow(row.incoming)}</div><div class="content">${title}${peer}</div>${timing}${action}</article>`;
 }).join('');
}
document.querySelectorAll('.surface').forEach(surface=>{const select=surface.querySelector('select');select.innerHTML='<option value="">全部设备</option>'+data.map(row=>`<option>${row.peer}</option>`).join('');select.addEventListener('change',()=>render(surface,select.value));render(surface);});
document.getElementById('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';document.getElementById('theme').textContent=dark?'切换浅色':'切换深色';});
let toastTimer;
function toast(message){document.getElementById('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',3000);}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;if(target.dataset.action==='text')document.getElementById('text-view').showModal();else toast('布局预览：这里会打开本机文件目录');});
document.getElementById('close').onclick=()=>document.getElementById('text-view').close();
document.getElementById('copy').onclick=()=>toast('布局预览：复制按钮放在文本查看页');
</script>
</body>
</html>
