<script>
const $=id=>document.getElementById(id);const icon=(name,cls='')=>`<svg aria-hidden="true" class="${cls}"><use href="#i-${name}"/></svg>`;
let platform='mac',state='ready',selected=true,fileChosen=false,verified=true,progress=0,timer=null,toastTimer=null,wasIncoming=false;
const target=()=>platform==='mac'?'小米手机':'MacBook Pro';const targetOS=()=>platform==='mac'?'Android':'macOS';const targetIcon=()=>platform==='mac'?'phone':'laptop';
function setPlatform(value){platform=value;$('app').classList.toggle('phone',value==='android');$('mac-tab').setAttribute('aria-pressed',value==='mac');$('android-tab').setAttribute('aria-pressed',value==='android');render()}
function toggleTheme(){let dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').setAttribute('aria-pressed',dark);$('theme').querySelector('span').textContent=dark?'浅色':'深色'}
function changeScenario(value){clearInterval(timer);closeModal();state=value;selected=value!=='empty';fileChosen=['sending','failed'].includes(value);verified=true;progress=67;wasIncoming=value==='complete';render();if(value==='incoming')showIncoming()}
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3200)}
function refreshPeers(){if(state==='empty'){toast('演示：仍未发现设备，请检查同一 Wi-Fi 或手动连接。')}else toast('演示：附近有 2 台设备。')}
function render(){let empty=state==='empty';$('peer-count').textContent=empty?'0':platform==='android'?'1':'2';$('peers').innerHTML=empty?'<div class="empty-peer">还没有发现设备</div>':`<button class="peer ${selected?'selected':''}" aria-pressed="${selected}" onclick="showVerify()"><span class="device-icon">${icon(targetIcon())}</span><span class="grow"><span class="peer-name">${target()}</span><span class="small muted" style="display:block">${targetOS()} · ${verified?'已核对':'等待核对'}</span></span>${selected?icon('check','selection-check'):''}</button><button class="peer secondary" onclick="toast('这台设备暂时不可用。演示请选择第一台设备。')"><span class="device-icon">${icon('laptop')}</span><span class="grow"><span class="peer-name">工作电脑</span><span class="small muted" style="display:block">macOS · 未核对</span></span></button>`;
let content='';if(empty){content=`<div class="empty">${icon('wifi')}<h2>还没有发现附近设备</h2><p>让两台设备连接同一 Wi-Fi，<br>并在对方设备打开 dukto2。</p><button class="button primary" onclick="refreshPeers()">${icon('refresh')}重新查找</button><div style="margin-top:10px"><button class="button quiet" onclick="showManual()">手动输入地址</button></div></div>`}
else {content=`<div class="section-label">发送到</div><div class="target"><span class="device-icon">${icon(targetIcon())}</span><div class="grow"><div class="target-name">${target()}</div><span class="verified">${icon('shield')}核对码已确认</span></div><button class="icon-button" aria-label="查看设备核对码" onclick="showVerify()">${icon('info')}</button></div>`;
if(!fileChosen&&!['sending','waiting','failed','sent','cancelled'].includes(state)){content+=`<div class="choose">${icon('upload','upload-icon')}<h2>选择一个文件，发送给对方</h2><p class="muted">对方确认接收后开始传输</p><button class="button primary" onclick="chooseFile()">${icon('plus')}选择文件</button><div class="choose-note">每次发送一个文件 · 保留原始内容</div></div>`}
else {let transmitting=state==='sending',waiting=state==='waiting',failed=state==='failed',sent=state==='sent',cancelled=state==='cancelled';let status=transmitting?'正在发送':waiting?'等待对方接收':failed?'连接中断':sent?'已发送，校验通过':cancelled?'已取消发送':'准备就绪';let statusIcon=failed?'alert':sent?'check':waiting?'clock':cancelled?'x':'upload';content+=`<div class="file-card"><div class="row"><span class="file-icon">${icon('file')}</span><div class="grow"><div class="file-name">旅行照片.zip</div><div class="file-size numbers">128 MB · ZIP 文件</div></div>${!transmitting&&!waiting?`<button class="icon-button" aria-label="移除已选文件" onclick="resetFile()">${icon('x')}</button>`:''}</div><div class="status-line" style="color:${failed?'var(--error)':sent?'var(--success)':'var(--ink)'}">${icon(statusIcon)}<span role="status">${status}</span>${transmitting?`<strong style="margin-left:auto" class="numbers" id="percent">${progress}%</strong>`:''}</div>${transmitting?`<div class="progress-track" role="progressbar" aria-label="发送进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}" id="progress"><div class="progress-fill" id="bar" style="width:${progress}%"></div></div><div class="progress-meta numbers"><span id="bytes">${Math.round(128*progress/100)} / 128 MB</span><span>约 18 MB/s</span></div>`:''}${failed?'<p class="small muted" style="margin-top:8px">检查对方是否仍在同一网络，然后重新发送。</p>':''}${cancelled?'<p class="small muted" style="margin-top:8px">本次传输已停止，可以重新发送。</p>':''}<div class="transfer-actions">${transmitting||waiting?`<button class="button" onclick="cancelTransfer()">取消</button>${waiting?'<button class="button primary" onclick="startTransfer()">模拟对方接收</button>':''}`:sent?'<button class="button primary" onclick="resetFile()">发送另一个文件</button>':`<button class="button quiet" onclick="chooseFile()">更换文件</button><button class="button primary" onclick="send()">${icon('send')}${failed?'重新发送':'发送文件'}</button>`}</div></div><div class="send-note">${icon('lock')}<span>${waiting?'请在对方设备上确认接收。':'文件仅在这两台设备之间传输。'}</span></div>`}}
$('workspace').innerHTML=content;$('history').innerHTML=`${wasIncoming?historyRow('旅行照片.zip','128 MB',true,true):''}${historyRow('项目说明.pdf','4.2 MB',true,false)}${historyRow('会议笔记.txt','12 KB',false,false)}`}
function historyRow(name,size,incoming,latest){return `<div class="history-row"><span class="device-icon">${icon(incoming?'down':'upload')}</span><div class="grow"><div class="history-name">${name}</div><div class="history-meta">${incoming?'来自':'发往'} ${target()} · ${size}</div></div><div class="history-end"><div class="history-result">${icon('check')}${incoming?'已接收':'已发送'}</div>${incoming?`<button class="open-file" onclick="showExport()">${platform==='mac'?'查看':'保存到…'}</button>`:'<div style="margin-top:5px">14:28</div>'}</div></div>`}
function chooseFile(){clearInterval(timer);fileChosen=true;state='ready';render();toast('已选择演示文件「旅行照片.zip」。')}
function resetFile(){clearInterval(timer);fileChosen=false;state='ready';render()}
function send(){state='waiting';render()}
function startTransfer(){state='sending';progress=0;render();timer=setInterval(()=>{progress=Math.min(100,progress+5);if(state!=='sending'){clearInterval(timer);return}$('bar').style.width=progress+'%';$('percent').textContent=progress+'%';$('bytes').textContent=Math.round(128*progress/100)+' / 128 MB';$('progress').setAttribute('aria-valuenow',progress);if(progress===100){clearInterval(timer);state='sent';render();toast('演示：对方已收到，文件校验通过。')}},350)}
function cancelTransfer(){clearInterval(timer);state='cancelled';render()}
function openModal(content,kind='normal'){$('modal').innerHTML=content;$('modal').dataset.kind=kind;$('modal').classList.toggle('mobile-dialog',platform==='android');if(!$('modal').open)$('modal').showModal()}
function closeModal(){if($('modal').open)$('modal').close()}
function showVerify(){openModal(`<div class="modal-mark">${icon('shield')}</div><h2 id="dialog-title">核对 ${target()}</h2><p>在对方设备打开「本机信息」，确认核对码与下方完全一致。</p><div class="code numbers">2F7A 9C10<br>83BE 6D42</div><p class="subnote">设备名称不能证明身份。请实际查看对方屏幕后再确认。</p><div class="dialog-actions"><button class="button" onclick="closeModal()">取消</button><button class="button primary" onclick="confirmPeer()">一致，连接</button></div>`)}
function confirmPeer(){selected=true;verified=true;if(state==='empty')state='ready';closeModal();render();toast('演示：已确认当前设备核对码。')}
function showLocal(){openModal(`<div class="modal-mark">${icon(platform==='mac'?'laptop':'phone')}</div><h2 id="dialog-title">本机信息</h2><p>让另一台设备查看此处的核对码。</p><div class="code numbers">9A31 08F2<br>C417 6B05</div><div class="details-row"><span class="muted">设备名称</span><span>${platform==='mac'?'我的 Mac':'小米手机'}</span></div><div class="details-row"><span class="muted">手动连接地址</span><span class="numbers">192.168.1.20:45879</span></div><p class="subnote">以上均为预览示例，不是当前设备信息。</p><div class="dialog-actions"><button class="button primary" onclick="closeModal()">完成</button></div>`)}
function showManual(){openModal(`<div class="modal-mark">${icon('wifi')}</div><h2 id="dialog-title">手动连接</h2><p>在对方设备的「本机信息」中找到地址。</p><form onsubmit="manualSubmit(event)"><label for="address">设备地址</label><input id="address" placeholder="192.168.1.20:45879" autocomplete="off" spellcheck="false" aria-describedby="address-help"><p class="small" id="address-help" style="margin-top:8px">支持 IP:端口。本预览仅演示连接流程。</p><div id="address-error" class="error-text" role="alert" hidden>请输入有效的 IPv4 地址和 1–65535 端口。</div><div class="dialog-actions"><button type="button" class="button" onclick="closeModal()">取消</button><button class="button primary" type="submit">下一步</button></div></form>`)}
function manualSubmit(e){e.preventDefault();const v=$('address').value.trim();const parts=v.split(':');const ip=parts[0].split('.');const valid=parts.length===2&&ip.length===4&&ip.every(p=>/^\d{1,3}$/.test(p)&&+p<=255)&&/^\d+$/.test(parts[1])&&+parts[1]>0&&+parts[1]<=65535;$('address-error').hidden=valid;$('address').setAttribute('aria-invalid',!valid);if(valid){showVerify()}}
function showIncoming(){openModal(`<div class="modal-mark">${icon('down')}</div><h2 id="dialog-title">${target()} 想发送文件</h2><p>是否接收这个文件？</p><div class="dialog-file"><span class="file-icon">${icon('file')}</span><div class="grow"><div class="file-name">旅行照片.zip</div><div class="file-size">128 MB · ZIP 文件</div></div></div><p class="subnote">来源名称未经验证，仅接收你认识的文件。</p><div class="dialog-actions"><button class="button" onclick="declineIncoming()">拒绝</button><button class="button primary" onclick="acceptIncoming()">接收文件</button></div>`,'incoming')}
function declineIncoming(){closeModal();state='ready';$('scenario').value='ready';render();toast('演示：已拒绝接收。')}
function acceptIncoming(){closeModal();clearInterval(timer);state='complete';fileChosen=false;selected=true;wasIncoming=true;$('scenario').value='complete';render();toast('演示：已接收「旅行照片.zip」，校验通过。')}
function showExport(){openModal(`<div class="modal-mark">${icon('check')}</div><h2 id="dialog-title">文件已接收</h2><p>旅行照片.zip · 128 MB<br>文件大小与内容校验通过。</p><p class="subnote">正式应用中，${platform==='mac'?'此处在 Finder 中查看接收的文件。':'此处打开 Android 系统保存界面，选择文件保存位置。'}本预览不操作磁盘文件。</p><div class="dialog-actions"><button class="button primary" onclick="closeModal()">完成</button></div>`)}
$('modal').addEventListener('cancel',e=>{if($('modal').dataset.kind==='incoming'){e.preventDefault();declineIncoming()}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&timer){clearInterval(timer);timer=null;if(state==='sending')toast('演示传输已停留在当前进度。')}});render();
</script>
</body></html>
